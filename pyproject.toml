[project]
name = "course1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "douchuan", email = "1843657913@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "langchain-community>=0.4.2",
    "langchain-faiss>=0.1.1",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.2",
    "langchain[openai]>=1.4.7",
    "langgraph>=1.2.17",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.ruff.lint.per-file-ignores]
# 示例教学文件按顺序命名，允许以数字开头，忽略模块名规范检查
"src/course1/*.py" = ["N999"]
"src/course2/*.py" = ["N999"]
